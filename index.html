<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu PDV</title>
<meta name="theme-color" content="#6b2fc9">
<meta name="description" content="Frente de caixa, estoque e variações de produto com leitura de QR Code pelo SKU.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu PDV">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de coluna única (até 480px). Cinco abas (Caixa, Produtos, Estoque, Vendas, Mais), barra do carrinho fixa acima delas e leitor de QR em tela cheia. Interface grafite e papel; a cor aparece só para avisar (estoque baixo, sem estoque). */
:root {
  color-scheme: light; padding-top: env(safe-area-inset-top, 0px);
  --bg: #ffffff; --surface: #ffffff; --ink: #0b0b0b; --ink2: #3d3a46; --muted: #6a6575;
  --grid: #ece9f2; --axis: #cfc9dc; --line: rgba(11,11,11,.12); --danger: #b32f2f; --okc: #006300;
  --warn: #fab219; --crit: #d03b3b;
  --brand: #6b2fc9; --brand-ink: #ffffff; --brand-soft: #f1eafc; --teal: #0e9f96; --teal-soft: #e3f6f4; --accent: #0e9f96;
  --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 190px; }

.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--muted); }
.tabtitle { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 16px 0 4px; }
.pbar { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--axis); background: none; border-radius: 999px; padding: 6px 14px; font-weight: 500; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.sheet .seg { margin-bottom: 14px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 600; color: var(--ink2); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

select, textarea, input[type=text], input[type=date], input[type=number], input[type=search], input:not([type]) { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--axis); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; }
textarea { min-height: 100px; resize: vertical; }
.btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; white-space: nowrap; }
.btn-big { padding: 16px; font-size: 17px; width: 100%; }
.btn-primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: none; }
.btn[disabled] { opacity: .5; }
.btnrow { display: flex; flex-direction: column; gap: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.linkbtn { background: none; border: 0; padding: 8px 0 0; color: var(--ink2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0 0 2px; }
.card .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.foot { color: var(--muted); font-size: 13px; margin: 10px 0 0; overflow-wrap: anywhere; }
.sect { font-family: var(--display); font-weight: 600; font-size: 15px; margin: 18px 2px 8px; color: var(--ink2); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.kpis .k { display: block; color: var(--ink2); font-size: 13px; }
.kpis .kv { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpis.big .kv { font-size: 30px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; margin-top: 12px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--grid); padding: 12px 0; min-width: 0; }
.row:first-child { border-top: 0; }
.mid { flex: 1; min-width: 0; }
.t1 { font-weight: 600; overflow-wrap: anywhere; }
.t2 { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
.amt small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.chev { color: var(--muted); }
.ghead { font-size: 13px; font-weight: 600; color: var(--ink2); padding: 12px 0 0; border-top: 1px solid var(--grid); }
.ghead:first-child { border-top: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--grid); color: var(--ink); white-space: nowrap; }
.pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.warn::before { background: var(--warn); }
.pill.crit::before { background: var(--crit); }
.pill.ok::before { background: var(--okc); }
.warnt { color: var(--danger); font-weight: 600; }
.modes { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.mode { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 18px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.mode:first-child { background: var(--brand-soft); }
.mode .i { width: 28px; height: 28px; flex: none; stroke: var(--brand); }
.mode .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mode .mt strong { font-family: var(--display); font-size: 19px; }
.mode .mt span { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.modebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
.modebar .linkbtn { padding: 4px 0; }
.valcard .kpis .foot { display: block; }
.valcard .k { display: block; color: var(--muted); font-size: 13px; }
.valcard .kv.big { display: block; font-family: var(--display); font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; margin-top: 2px; }
body.nonav #nav, body.nonav #cartbar { display: none; }
body.nonav .wrap { padding-bottom: 48px; }
.gh2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 4px; }
.skunote { margin: -4px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--teal-soft); font-size: 13.5px; overflow-wrap: anywhere; }
.skunote.bad { background: #fdecec; }
.skunote .btnrow { margin-top: 8px; }
.empty { text-align: center; padding: 26px 8px; color: var(--ink2); }
.empty h2 { font-family: var(--display); font-size: 20px; color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 0 14px; }
.empty .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--axis); border-radius: 10px; overflow: hidden; flex: none; }
.stepper button { width: 38px; height: 38px; border: 0; background: var(--surface); font-size: 20px; line-height: 1; }
.stepper button:disabled { opacity: .35; }
.stepper span { min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.cline { padding: 12px 0; border-top: 1px solid var(--grid); }
.cline:first-child { border-top: 0; }
.cline .ctl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.cline .ctl .x { color: var(--muted); }
.cline .ctl input { width: 96px; padding: 8px 10px; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.cline .ctl .lt { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.totline { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; margin: 4px 0; }
.totline.grand { font-family: var(--display); font-size: 24px; font-weight: 700; margin-top: 8px; }

#cartbar { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); padding: 0 16px 8px; z-index: 10; pointer-events: none; }
#cartbar .cb { pointer-events: auto; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--brand); color: #fff; border: 0; border-radius: 16px; padding: 14px 18px; box-shadow: 0 6px 18px rgba(0,0,0,.25); font-weight: 500; }
#cartbar .cbv { font-weight: 700; font-variant-numeric: tabular-nums; }
#nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 11; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
#nav button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11.5px; font-weight: 500; color: var(--muted); border-radius: 10px; min-width: 0; }
#nav button[aria-current="page"] { color: var(--brand); font-weight: 600; }
#nav button[aria-current="page"] svg { color: var(--teal); }

#sheet:empty { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; max-height: 92%; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 21; }
.sheet h2 { font-family: var(--display); font-size: 19px; margin: 0 0 4px; overflow-wrap: anywhere; }
.sheet .ctxtag { color: var(--muted); font-size: 13px; margin-bottom: 14px; overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.field .tip { font-size: 12px; color: var(--muted); }
.inrow { display: flex; gap: 8px; }
.inrow input { flex: 1; }
.money-in { position: relative; }
.money-in span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.money-in input { padding-left: 40px; }
.actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.chk { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
.chk input { width: 20px; height: 20px; flex: none; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

.evo { display: flex; gap: 4px; height: 130px; border-bottom: 1px solid var(--axis); }
.evo .col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.evo .v { font-size: 10.5px; margin-bottom: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.evo .b { width: 100%; max-width: 22px; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
.evol { display: flex; gap: 4px; margin-top: 6px; }
.evol span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); min-width: 0; }
.brow { margin: 10px 0; }
.brow .tp { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.brow .vl { white-space: nowrap; font-variant-numeric: tabular-nums; }
.track { height: 10px; background: var(--grid); border-radius: 0 5px 5px 0; }
.fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }

#scan { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; }
#scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.reticle { position: absolute; left: 50%; top: 42%; width: min(68vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 22px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.9); pointer-events: none; }
.scantop { position: absolute; top: 0; left: 0; right: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(#000a, transparent); }
.scantitle { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.scanbottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, #000c); display: flex; flex-direction: column; gap: 10px; }
.smsg { font-size: 17px; font-weight: 600; min-height: 46px; overflow-wrap: anywhere; }
.smsg.bad { color: #ffb4b4; }
.smsg small { display: block; font-weight: 400; font-size: 13px; opacity: .85; }
.srow { display: flex; gap: 8px; flex-wrap: wrap; }
#scan .btn { background: #fcfcfb; color: #0b0b0b; border-color: #fcfcfb; }
#scan .smsg .btn { margin-top: 8px; }
@media (prefers-reduced-motion: no-preference) { .fill, .evo .b { transition: height .25s, width .25s; } }
#c-info { margin: 4px 0 14px; color: var(--ink2); font-size: 14px; }
#c-info:empty { display: none; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.pct-in { position: relative; }
.pct-in span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.pct-in input { padding-right: 32px; }
@media (min-width: 900px) {
  .wrap, #nav, #cartbar { max-width: 880px; }
  .sheet { max-width: 600px; }
}

.brand h1 { color: var(--ink); }
.brand h1::after { content: ''; display: block; width: 36px; height: 4px; border-radius: 2px; margin-top: 4px; background: linear-gradient(90deg, var(--brand), var(--teal)); }
.tabtitle { color: var(--brand); }
.row:disabled { cursor: default; opacity: 1; }
.row:disabled .amt { color: var(--ink); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); vertical-align: middle; margin-left: 2px; }
.rsel { font: inherit; border: 1px solid var(--axis); border-radius: 10px; padding: 8px 10px; background: var(--surface); color: var(--ink); max-width: 46%; }
.gate { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 8px; }
.gate h1 { font-family: var(--display); font-size: 26px; margin: 14px 0 8px; overflow-wrap: anywhere; }
.gate-mark { width: 240px; max-width: 70vw; height: auto; display: block; margin: 0 auto; }
.evbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--brand-soft); }
.evbar .mid { flex: 1 1 140px; min-width: 0; }
.evbar .btn { padding: 8px 12px; min-height: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.brand { align-items: center; }
.brand .logo { height: 76px; width: auto; display: block; margin: -4px 0 -2px -6px; }
.gate .btn-big { margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="cartbar"></div>
<nav id="nav" aria-label="Navegação"></nav>
<div id="sheet"></div>
<div id="scan" hidden></div>
<div id="toast" role="status" hidden></div>
<input id="f-backup" type="file" accept=".json,application/json,text/plain" hidden>
<input id="f-csv" type="file" accept=".csv,text/csv,text/plain" hidden>
<!-- jsQR 1.4.0 (Apache-2.0), leitor de QR Code usado quando o navegador não tem leitor próprio. -->
<script src="jsQR.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-bundle.js"></script>
<script>
(function () {
'use strict';
const KEY = 'pdv:v1', CKEY = 'pdv:cart';
const PAY = { dinheiro: 'Dinheiro', pix: 'Pix', credito: 'Crédito', debito: 'Débito', outro: 'Outro' };
const FEEKEYS = [['dinheiro', 'Dinheiro'], ['pix', 'Pix'], ['debito', 'Débito'], ['c1', 'Crédito 1x (à vista)'], ['c2', 'Crédito 2x'], ['c3', 'Crédito 3x'], ['outro', 'Outro']];
const DEFCATS = ['Moletons', 'Camisetas', 'Camiseta infantil', 'Moletom infantil', 'Acessórios', 'Bolsas', 'Papelaria'];
const feeKey = (pay, inst) => pay === 'credito' ? 'c' + (inst >= 1 && inst <= 3 ? inst : 1) : pay;
const feeBp = (pay, inst) => Math.max(0, +(D.store.fees || {})[feeKey(pay, inst)] || 0);
const fmtPct = bp => (bp / 100).toFixed(2).replace('.', ',');
function parsePct(s) { s = String(s == null ? '' : s).replace(/[^\d.,]/g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) && n > 0 ? Math.min(10000, Math.round(n * 100)) : 0; }
const payLabel = s => PAY[s.pay] + (s.pay === 'credito' && s.inst > 1 ? ' ' + s.inst + 'x' : '');
const payKey = s => s.pay === 'credito' ? 'credito-' + (s.inst > 1 ? s.inst : 1) : s.pay;
const payKeyLabel = k => k.indexOf('credito-') === 0 ? 'Crédito' + (k.slice(8) !== '1' ? ' ' + k.slice(8) + 'x' : ' à vista') : PAY[k];
function allocate(amount, w) { const sum = w.reduce((a, b) => a + b, 0); if (!sum) return w.map(() => 0); let acc = 0, prev = 0; return w.map(x => { acc += x; const cum = Math.round(amount * acc / sum); const r = cum - prev; prev = cum; return r; }); }
function saleLines(s) {
  const g = s.items.map(i => i.qty * i.price), net = allocate(s.total || 0, g), fee = allocate(s.fee || 0, g);
  return s.items.map((i, k) => { const cost = i.qty * (i.cost || 0); return { i, gross: g[k], net: net[k], fee: fee[k], cost, profit: net[k] - fee[k] - cost }; });
}
function saleCalc(s) { const cost = s.items.reduce((a, i) => a + i.qty * (i.cost || 0), 0), fee = s.fee || 0; return { cost, fee, profit: (s.total || 0) - cost - fee }; }
function reportRows(ok) {
  const m = new Map();
  ok.forEach(s => saleLines(s).forEach(x => {
    const k = x.i.vid; let r = m.get(k);
    if (!r) { r = { name: x.i.name, label: x.i.label, sku: x.i.sku, cat: catOfItem(x.i), q: 0, rev: 0, cost: 0, fee: 0, profit: 0, nocost: false }; m.set(k, r); }
    r.q += x.i.qty; r.rev += x.net; r.cost += x.cost; r.fee += x.fee; r.profit += x.profit; if (!x.i.cost) r.nocost = true;
  }));
  return Array.from(m.values()).sort((a, b) => b.profit - a.profit);
}

const MAB = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MT = { venda: 'Venda', cancelamento: 'Venda cancelada', entrada: 'Entrada', saida: 'Saída', contagem: 'Contagem', inicial: 'Estoque inicial', importacao: 'Importação', estampa: 'Estampa', site: 'Venda do site', sitecancel: 'Venda do site cancelada', compra: 'Compra', producao: 'Produção', ajuste: 'Ajuste' };
const IC = {
  cam: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  cart: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>',

}

/* ---------- lisos (peças em branco), estampa e vendas do site ---------- */
/* Um produto com kind 'liso' é a peça sem estampa (ex.: Moletom · Preto / P). Os produtos prontos (estampados) são ligados
   ao liso de onde saem: automaticamente pelo modelo, cor e tamanho, ou escolhido na variação (v.bvid; 'none' = não usa liso). */
const isLiso = p => !!p && p.kind === 'liso';
const isPronto = p => !!p && !p.kind;
const ofKind = p => S.kind === 'liso' ? isLiso(p) : isPronto(p);
const LSTOP = ['liso', 'lisa', 'lisos', 'lisas', 'em', 'de', 'da', 'do', 'peca', 'pecas', 'branca', 'sem', 'estampa'];
const toks = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
/* leitura do SKU: modelo (MOL moletom, BL baby look, C camiseta), cor (P preto, B branco, OFF off white, MAR marsala) e tamanho (PP, P, M, G, GG, XG, EG ou número: 2 a 16).
   A estampa pode estar em qualquer posição; ela é ignorada. Quando cor e tamanho vêm juntos, a cor vem primeiro: PP = Preto P, PPP = Preto PP. */
const SK_MODEL = { MOL: 'moletom', BL: 'babylook', C: 'camiseta' };

function skuAttrs(sku) {
  const toks = String(sku || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^A-Z0-9]+/).filter(Boolean), r = {}, rest = [];
  const full = new RegExp('^(MOL|BL|C)(OFF|MAR|B|P)?' + SK_SIZE + '?$'), cs = new RegExp('^(OFF|MAR|B|P)' + SK_SIZE + '$'), sz = new RegExp('^' + SK_SIZE + '$');
  toks.forEach(t => {
    let m;
    if (!r.m && (m = t.match(full))) { r.m = SK_MODEL[m[1]]; if (m[2]) r.c = SK_COLOR[m[2]]; if (m[3]) r.s = m[3]; return; }
    if (!r.m && /^MOL[A-Z0-9]+$/.test(t)) { r.m = 'moletom'; return; }
    rest.push(t);
  });
  rest.forEach((t, i) => {
    let m;
    if (!r.c && !r.s && (m = t.match(cs))) { r.c = SK_COLOR[m[1]]; r.s = m[2]; return; }
    if (!r.c && (t === 'OFF' || t === 'MAR' || t === 'B' || (t === 'P' && rest.slice(i + 1).some(x => sz.test(x))))) { r.c = SK_COLOR[t]; return; }
    if (r.c && !r.s && sz.test(t)) r.s = t;
  });
  return r.m && r.c && r.s ? r : null;
}
/* o mesmo para o liso, pelo SKU dele ou, sem SKU, pelo nome (Moletom) e a variação (Off White / P) */
function lisoAttrs(lp, lv) {
  const a = skuAttrs(lv.sku); if (a) return a;
  const nt = toks(lp.name), lt = toks(lv.label || ''), all = nt.concat(lt), r = {};
  r.m = all.indexOf('moletom') >= 0 ? 'moletom' : (all.indexOf('babylook') >= 0 || (all.indexOf('baby') >= 0 && all.indexOf('look') >= 0)) ? 'babylook' : (all.indexOf('camiseta') >= 0 || all.indexOf('camisa') >= 0) ? 'camiseta' : '';
  r.c = lt.some(t => t === 'preto' || t === 'preta') ? 'preto' : lt.some(t => t === 'branco' || t === 'branca') ? 'branco' : (lt.indexOf('off') >= 0 || lt.indexOf('offwhite') >= 0) ? 'offwhite' : lt.indexOf('marsala') >= 0 ? 'marsala' : '';
  const s = lt.map(t => t.toUpperCase()).filter(t => /^(PP|P|M|GG|G|XG|EG|2|4|6|8|10|12|14|16)$/.test(t)); r.s = s.length ? s[s.length - 1] : '';
  return r.m && r.c && r.s ? r : null;
}
function lisoBySku(p, v) {
  const a = skuAttrs(v.sku); if (!a) return null; let hit = null, n = 0;
  D.products.forEach(lp => { if (!isLiso(lp)) return; lp.variants.forEach(lv => { const b = lisoAttrs(lp, lv); if (b && b.m === a.m && b.c === a.c && b.s === a.s) { hit = { p: lp, v: lv }; n++; } }); });
  return n === 1 ? hit : null;
}
function autoLiso(p, v) {
  if (!isPronto(p)) return null;
  const sk = lisoBySku(p, v); if (sk) return sk;
  const have = new Set(toks(p.name + ' ' + (v.label || ''))); let best = null, bs = 0;
  D.products.forEach(lp => {
    if (!isLiso(lp)) return; const pt = toks(lp.name).filter(t => LSTOP.indexOf(t) < 0); if (!pt.length || !pt.every(t => have.has(t))) return;

/* Insumo = produto com kind 'insumo' e uma variação; o estoque fica em milésimos da unidade (12 kg = 12000) para aceitar decimais. */

const fmtM = m => (Math.round(m || 0) / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const fmtQ = (p, m) => fmtM(m) + ' ' + unitOf(p);
const insVal = v => Math.round(Math.max(v.stock || 0, 0) * (v.cost || 0) / 1000);

const LOTT = { lot: 'Lote de produção', buy: 'Compra de lisos', ins: 'Compra de insumo' };

  const n = (r.out || []).reduce((a, o) => a + o.qty, 0); return LOTT[r.t] + ' · ' + plural(n, 'peça', 'peças') + (r.unit ? ' · ' + brl(r.unit) + '/peça' : '');
}

function parseVarLine(raw) {

  if (SZ_RE.test(last)) { const color = titleCase(parts.slice(0, -1).join(' ')); return { label: (color ? color + ' / ' : '') + last.toUpperCase(), qty }; }
  return { label: titleCase(parts.join(' ')), qty };
}

  if (S.period === 'mes') return ts => { const d = new Date(ts); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); };
  return () => true;
}
function chartData(sales) {

  else if (S.period === 'mes') { const n = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(); for (let i = 1; i <= n; i++) out.push({ k: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(i), l: i % 5 === 0 || i === 1 ? String(i) : '', t: 0 }); }

  else return null;

}

/* ---------- botão voltar do celular: fecha a janela aberta em vez de sair do app ---------- */
const NAV = { ign: 0, t: 0 };
const homeTab = () => ['caixa', 'produtos', 'estoque', 'vendas', 'mais'].find(tabAllowed) || 'caixa';
const atRoot = () => !sc.on && !S.sheet && (S.gate || (!S.mode || modesOk().length === 1) && (S.mode !== 'pdv' || S.tab === homeTab()));
const guarded = () => !!(history.state && history.state.pdv);
function guardLater() { clearTimeout(NAV.t); NAV.t = setTimeout(syncGuard, 0); }
function syncGuard() {
  if (NAV.ign) return;
  try {
    if (!atRoot()) { if (!guarded()) history.pushState({ pdv: 1 }, ''); }
    else if (guarded()) { NAV.ign++; history.back(); }
  } catch (e) {}
}
function goBack() {
  if (sc.on) { closeScan(); return true; }
  const sh = S.sheet;
  if (sh) {
    if (sh.type === 'cloudchoice') return true;
    if (sh.type === 'event') S.evAsked = true;
    if (sh.type === 'evextra' && sh.back && evById(sh.id)) { openEvent(sh.id); return true; }
    if ((sh.type === 'variant' || sh.type === 'batch') && D.products.some(p => p.id === sh.pid)) { openProduct(sh.pid); return true; }
    if (sh.type === 'adjust' && sh.back && D.products.some(p => p.id === sh.back)) { openProduct(sh.back); return true; }
    closeSheet(); render(); return true;
  }
  if (S.gate) return false;
  if (S.mode === 'pdv' && S.tab !== homeTab()) { S.tab = homeTab(); S.lim = 60; render(); window.scrollTo(0, 0); return true; }
  if (S.mode && modesOk().length > 1) { S.mode = ''; S.lim = 60; render(); window.scrollTo(0, 0); return true; }
  return false;
}
window.addEventListener('popstate', () => {
  if (NAV.ign) { NAV.ign--; syncGuard(); return; }
  goBack(); syncGuard();
});
